[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["sample_data", "workspace", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: tests that need real external systems (skipped by default)"]

[tool.coverage.run]
omit = ["app/ui/*"]
